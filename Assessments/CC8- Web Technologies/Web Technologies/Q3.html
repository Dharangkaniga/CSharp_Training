<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Events </title>
</head>
<body>
    <button id="Button">Click Here</button>

    <script>
        let button = document.getElementById("Button");
        button.addEventListener("click", function ()
        {
            alert("Button was clicked!!!");
        });
    </script>
</body>
</html>
