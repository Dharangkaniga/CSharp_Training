<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title> Multiply Or Division</title>
</head>
<body>

    <!---------  Question 1   ------>
    <h2>Calculator</h2>

    Enter First Number:<input type="text" id="num1" placeholder="Enter Number"><br><br>
    Enter Second Number: <input type="text" id="num2"placeholder="Enter Number"><br><br>

    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>
    <h3 id="result"></h3>

    <script>
        function multiply() {
            let n1 = parseFloat(document.getElementById("num1").value);
            let n2 = parseFloat(document.getElementById("num2").value);

            let result = n1 * n2;

            document.getElementById("result").innerHTML =
                "Multiplication Result: " + result;
        }
        function divide()
        {
            let n1 = parseFloat(document.getElementById("num1").value);
            let n2 = parseFloat(document.getElementById("num2").value);

            let result = n1 / n2;
            document.getElementById("result").innerHTML =
                "Division Result: " + result;
                
        }
    </script>


</body>
</html>
