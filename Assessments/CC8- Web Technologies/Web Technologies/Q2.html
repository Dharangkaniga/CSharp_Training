<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Orr Or Even </title>
</head>
<body>
    <h2>Odd or Even</h2>

    <script>
        function OddEven() {
            for (let i = 0; i <= 15; i++) {

                if (i % 2 == 0) {
                    console.log(i + " is Even");
                } else {
                    console.log(i + " is Odd");
                }

            }
        }
        OddEven();
    </script>
</body>
</html>
